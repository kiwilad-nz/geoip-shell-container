version: "3.8"

services:
  geoip-shell:
    build: .
    container_name: geoip-shell
    network_mode: host
    privileged: true
    cap_add:
      - NET_ADMIN
      - NET_RAW
    env_file:
      - .env
    volumes:
      - ./config:/etc/geoip-shell
      - ./data:/var/lib/geoip-shell
      - ./logs:/logs
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
